<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ensamble del chasis de corte</title>
<style>
:root{
--bg:#fff;--surface-1:#f4f3ee;--surface-2:#fff;--text:#1f1e1d;--text2:#5f5e5a;--muted:#888780;
--border:rgba(0,0,0,.15);--border-strong:rgba(0,0,0,.3);--border-stronger:rgba(0,0,0,.45);
--accent-bg:#e6f1fb;--accent-text:#0c447c;--accent-border:#378add;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--bg:#1c1c1a;--surface-1:#262624;--surface-2:#2e2e2b;--text:#f1efe8;--text2:#b4b2a9;--muted:#888780;
--border:rgba(255,255,255,.15);--border-strong:rgba(255,255,255,.3);--border-stronger:rgba(255,255,255,.45);
--accent-bg:#0c447c;--accent-text:#b5d4f4;--accent-border:#85b7eb;
}}
:root[data-theme="dark"]{
--bg:#1c1c1a;--surface-1:#262624;--surface-2:#2e2e2b;--text:#f1efe8;--text2:#b4b2a9;--muted:#888780;
--border:rgba(255,255,255,.15);--border-strong:rgba(255,255,255,.3);--border-stronger:rgba(255,255,255,.45);
--accent-bg:#0c447c;--accent-text:#b5d4f4;--accent-border:#85b7eb;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin:0 0 12px}
svg{display:block;width:100%;height:auto}
svg text.ts{font-size:11px;fill:var(--text2);font-family:inherit}
.bn{font-size:9px;font-weight:600;fill:var(--accent-text);font-family:inherit;pointer-events:none}
.bc{fill:var(--accent-bg);stroke:var(--accent-border);stroke-width:1}
.vn,.vs{transition:opacity var(--ts,.3s)}
button{font:inherit;font-size:14px;color:var(--text);background:transparent;border:.5px solid var(--border-strong);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:36px}
button:hover{background:var(--surface-1)}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed}
button.active{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent-text)}
@keyframes dT{to{stroke-dashoffset:-5}}
@keyframes dC{to{stroke-dashoffset:-10}}
@media (prefers-reduced-motion: no-preference){
.spin{animation:dT .5s linear infinite}
.run{animation:dC .5s linear infinite}
}
.row{display:flex;align-items:center;width:100%;text-align:left;min-height:36px;padding:4px 10px;margin:0 0 4px;font-size:14px}
.row[aria-pressed="true"]{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent-text)}
.g{cursor:pointer}
.info{background:var(--surface-1);border-radius:8px;padding:12px 14px;margin:0 0 12px;min-height:76px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 8px;align-items:center}
.speed-box{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.speed-box input[type=range]{width:90px;accent-color:#378add}
#counter{font-size:13px;color:var(--text2);margin:0 0 8px}
#st{font-size:13px;color:var(--text2);margin:0 0 12px}

/* --- OCULTAR PUNTOS AZULES DECORATIVOS --- */
svg circle[fill="#378ADD"], 
svg circle[fill="#85b7eb"], 
svg circle[fill="#e8c12a"],
svg circle[fill="#9cc9ef"] {
  display: none !important;
}
/* Ocultar el rectángulo punteado azul (si es un path con borde punteado) */
svg path[stroke="#378ADD"][stroke-dasharray],
svg rect[stroke="#378ADD"][stroke-dasharray] {
  display: none !important;
}


/* --- OCULTAR SOLO LOS PUNTOS AZULES SÓLIDOS --- */
/* Apuntamos específicamente a los círculos con 'fill' azul (relleno), pero no a las líneas */
circle[fill="#378ADD"], 
circle[fill="#85b7eb"], 
circle[fill="#e8c12a"] {
  display: none !important;
}

</style>
</head>
<body>
<main>

</g>

"font-size:5.5px;fill:#3f444a;font-family:inherit">ASM-001 · 220 V</text><path d="M98 272 L202 272" stroke="#5f656b" stroke-width="2"/><g id="ov" style="pointer-events:none"></g>

<div class="controls">
  <button id="bRun" onclick="runOne()">Procesar 1</button>
  <button id="bCont" onclick="toggleContinuous()">Producción continua</button>

<p id="counter">Piezas procesadas: 0</p>
<p id="st">Estado: listo</p>

<div class="info">

<p id="iE" style="font-size:13px;color:var(--text2);margin:0 0 6px">Selecciónala en el dibujo o en la lista.</p>
<p id="iD" style="font-size:14px;margin:0;line-height:1.5"></p>
</div>
<div id="tree"></div>
</main>

<script>
var P={
frame:{es:'Ensamble del chasis de corte',en:'Cutting chassis assembly',d:'Bastidor de acero atornillado con perfiles C y tubo cuadrado, con patas de montaje. Soporta todos los subsistemas.',b:[[22,66,356,256]]},
rail:{es:'Riel y cadena de avance',en:'Conveyor rail and chain',d:'Cadena de rodillos sobre un riel superior. Arrastra el carro y la pierna por cada estación.',b:[[42,32,316,26]]},
hook:{es:'Gancho de transporte',en:'Conveyor hook',d:'Grillete giratorio y gancho en U que unen el carro con el producto.',b:[[132,30,36,76]]},
leg:{es:'Pierna avícola / Músculo',en:'Poultry leg / meat',d:'El producto, colgado en vertical. Al prensarse, el músculo se estrecha en la zona de las almohadillas. Tras el corte, la parte inferior cae a la bandeja.',b:[[116,102,68,162]]},
discs:{es:'Discos alineadores de plástico',en:'Upper and lower plastic alignment discs',d:'Dos discos dentados de HDPE o UHMW en un eje vertical. Giran con sus dientes y empujan la pierna hacia adentro, en línea recta, hacia el disco de corte.',b:[[46,154,104,64]]},
shaft:{es:'Eje de corte (vertical)',en:'Vertical cutting shaft',d:'Eje fijo montado en el bastidor superior. Sostiene el disco a la altura media de la pierna.',b:[[155,64,54,118]]},
blade:{es:'Disco de corte giratorio (horizontal)',en:'Horizontal rotary cutting disc',d:'Disco dentado a la altura media de la pierna. Gira en plano horizontal y queda fijo; la pierna avanza hacia adentro y el disco la atraviesa por completo.',b:[[116,172,132,28]]},
act:{es:'Actuadores neumáticos (prensado lateral)',en:'Pneumatic pressing actuators (x2)',d:'Cilindros horizontales de doble efecto con mangueras azules. Sus almohadillas llevan una cara blanda para apretar el músculo sin dañarlo.',b:[[30,212,92,56],[180,212,158,56]]}
};
var order=['frame','rail','hook','leg','discs','shaft','blade','act'];
var NS='http://www.w3.org/2000/svg';
var tree=document.getElementById('tree');
order.forEach(function(k,i){
  var b=document.createElement('button');
  b.className='row';b.id='r_'+k;b.setAttribute('aria-pressed','false');
  b.textContent=(i+1)+'. '+P[k].es;b.onclick=function(){sel(k)};
  tree.appendChild(b);
});

/* Discos alineadores en forma de engrane */
function gear(cx,cy,r,n,ph){ph=ph||0;
  var d='';
  for(var i=0;i<n;i++){
    var a=i*2*Math.PI/n+ph;
    [[-.2,.8],[-.13,1],[.13,1],[.2,.8]].forEach(function(q,j){
      var x=cx+r*q[1]*Math.cos(a+q[0]), y=cy+.27*r*q[1]*Math.sin(a+q[0]);
      d+=(i+j?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
    });
  }
  return d+'Z';
}
(function(){
  var g=document.getElementById('gears'),h='';
  [199,171].forEach(function(cy){
    h+='<path d="'+gear(98,cy+4,50,8)+'" fill="#b3bac0"/>';
    h+='<path d="'+gear(98,cy,50,8)+'" fill="#f4f5f6" stroke="#9aa0a5" stroke-width=".7"/>';
    h+='<ellipse cx="98" cy="'+cy+'" rx="14" ry="5" fill="#c3c8cc" stroke="#5f656b" stroke-width=".5"/>';
  });
  g.innerHTML=h;
})();

function clearOv(){
  document.getElementById('ov').innerHTML='';
  order.forEach(function(k){document.getElementById('r_'+k).setAttribute('aria-pressed','false')});
}
function sel(k){
  if(busy)return;
  clearOv();
  var p=P[k],ov=document.getElementById('ov');
  p.b.forEach(function(b){
    var r=document.createElementNS(NS,'rect');
    r.setAttribute('x',b[0]);r.setAttribute('y',b[1]);
    r.setAttribute('width',b[2]);r.setAttribute('height',b[3]);
    r.setAttribute('rx',3);r.setAttribute('fill','none');
    r.setAttribute('stroke','#378ADD');r.setAttribute('stroke-width','1.2');
    r.setAttribute('stroke-dasharray','4 3');ov.appendChild(r);
  });
  document.getElementById('r_'+k).setAttribute('aria-pressed','true');
  document.getElementById('iN').textContent=p.es;
  document.getElementById('iE').textContent=p.en;
  document.getElementById('iD').textContent=p.d;
}

/* ---- Estado ---- */
var busy=false,pressed=false,spinning=false,continuous=false,processed=0,speed=1.0,running=false,cyc=0,last=0,gph=0,front=false,PERIOD=7000;
var $=function(i){return document.getElementById(i)};
var car=$('car'),cw=$('cw'),bg=$('bg'),L=$('L'),R=$('R'),teeth=$('teeth'),chain=$('chain'),cf=$('cf'),lowG=$('lowG'),fallG=$('fallG'),gears=$('gears');
car.style.transformOrigin='0px 34px';
function status(t){$('st').textContent='Estado: '+t}
function updateCounter(){$('counter').textContent='Piezas procesadas: '+processed}
function updateSpeed(){
  speed=parseFloat($('speed').value);
  $('spdLabel').textContent=speed.toFixed(1)+'× · '+(PERIOD/speed/1000).toFixed(1)+' s';
  document.documentElement.style.setProperty('--ts',(0.3/speed)+'s');
  L.style.transition=R.style.transition='transform '+(0.45/speed)+'s ease-in-out';
  teeth.style.animationDuration=(0.5/speed)+'s';
}
function setPress(p){
  pressed=p;
  L.style.transform='translateX('+(p?16:0)+'px)';
  R.style.transform='translateX('+(p?-16:0)+'px)';
  document.querySelectorAll('.vn').forEach(function(e){e.style.opacity=p?0:1});
  document.querySelectorAll('.vs').forEach(function(e){e.style.opacity=p?1:0});
  $('bPress').textContent=p?'Soltar pierna':'Prensar pierna';
}
function setSpin(s){
  spinning=s;
  teeth.classList.toggle('spin',s);
  $('bSpin').textContent=s?'Parar disco':'Girar disco';
}
function drawGears(){
  var h='';
  [199,171].forEach(function(cy){
    h+='<path d="'+gear(98,cy+4,50,8,gph)+'" fill="#b3bac0"/>';
    h+='<path d="'+gear(98,cy,50,8,gph)+'" fill="#f4f5f6" stroke="#9aa0a5" stroke-width=".7"/>';
    h+='<ellipse cx="98" cy="'+cy+'" rx="14" ry="5" fill="#c3c8cc" stroke="#5f656b" stroke-width=".5"/>';
  });
  gears.innerHTML=h;
}
function cl(x){return Math.max(0,Math.min(1,x))}
function showIdle(){
  car.style.transform='scale(1)';car.style.opacity=1;
  if(pressed)setPress(false);
  front=false;cw.before(bg);
  cf.style.opacity=0;lowG.style.transform='translateY(0px)';lowG.style.opacity=1;
  fallG.style.transition='none';fallG.style.transform='';fallG.style.opacity=0;
}
/* t: 0..1 = entra empujada, se prensa y corta, cae la pieza, sale la parte superior */
function frame(t){
  var sc=1,op=1;
  car.style.transform='scale('+sc+')';car.style.opacity=op;
  var pr=t>=.28&&t<.54;if(pr!==pressed)setPress(pr);
  var f=t>=.3;if(f!==front){front=f;f?cw.after(bg):cw.before(bg)}
  var cut=t>=.5,g=cl((t-.5)/.28);
  cf.style.opacity=cut?1:0;
  lowG.style.transform=cut?'translateY(5px)':'translateY(0px)';
  lowG.style.opacity=cut?0:1;
  fallG.style.transition='none';
  fallG.style.opacity=cut?1:0;
  fallG.style.transform=cut?'translate('+(8*g)+'px,'+(5+49*g*g)+'px) rotate('+(80*g)+'deg)':'';
  status(t<.28?'los alineadores empujan la pierna':t<.5?'prensando y cortando con el disco fijo':t<.78?'la pieza cortada cae a la bandeja':'siguiente pieza');
}
function tick(ts){
  if(!running)return;
  var dt=Math.min(50,ts-last);last=ts;
  cyc+=dt*speed/PERIOD;gph+=dt*0.005*speed;
  if(cyc>=1){cyc=0;processed++;updateCounter();if(!continuous)return finish()}
  frame(cyc);drawGears();
  requestAnimationFrame(tick);
}
function startRun(){
  if(running)return;
  running=true;busy=true;clearOv();setSpin(true);
  chain.classList.add('run');$('bRun').disabled=true;
  cyc=0;last=performance.now();frame(0);
  requestAnimationFrame(tick);
}
function finish(){
  running=false;busy=false;chain.classList.remove('run');setSpin(false);
  showIdle();$('bRun').disabled=false;status('listo');
  if(!continuous){$('bCont').classList.remove('active');$('bCont').textContent='Producción continua'}
}
function runOne(){continuous=false;startRun()}
function toggleContinuous(){
  continuous=!continuous;
  var btn=$('bCont');
  if(continuous){btn.classList.add('active');btn.textContent='Detener producción';startRun()}
  else{btn.classList.remove('active');btn.textContent='Producción continua';if(running)status('deteniendo al terminar la pieza…')}
}
function togglePress(){if(busy)return;setPress(!pressed);status(pressed?'pierna prensada':'listo')}
function toggleSpin(){if(busy)return;setSpin(!spinning);status(spinning?'disco girando':'listo')}
updateSpeed();drawGears();showIdle();
</script>
</body>
</html>
